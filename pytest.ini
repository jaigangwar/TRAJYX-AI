; TRAJYX test configuration.
;
; Lives at the repository root rather than in backend/pyproject.toml so it
; applies no matter how pytest is invoked. When config sat under backend/,
; running `pytest ../tests/backend/...` resolved rootdir to the repo root,
; silently skipped every async test as "no async plugin installed", and
; reported a green run.

[pytest]
testpaths =
    tests/backend
    tests/cv

; Both the backend package (`app.*`) and the repo root (`tests.*`) must be
; importable. The shared, cv and ml packages are installed editable.
pythonpath =
    .
    backend

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -q
    --strict-markers
    --strict-config

markers =
    integration: exercises more than one subsystem together
    slow: takes more than a couple of seconds

filterwarnings =
    ; Surface our own deprecations; third-party noise is silenced narrowly below.
    default
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
    ; anyio's internal memory streams, created by asyncio.to_thread and collected
    ; by the GC rather than closed. Library internals, not our resources.
    ignore:Unclosed <MemoryObject.*:ResourceWarning:anyio.streams.memory
