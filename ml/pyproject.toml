[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajyx-ml"
version = "0.1.0"
description = "TRAJYX risk-model training, evaluation and inference."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "trajyx-shared"]

[project.optional-dependencies]
training = ["pandas>=2.2", "scikit-learn>=1.6", "xgboost>=2.1"]

[tool.setuptools.packages.find]
include = ["trajyx_ml*"]
