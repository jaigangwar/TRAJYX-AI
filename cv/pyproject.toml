[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajyx-cv"
version = "0.1.0"
description = "TRAJYX computer-vision pipeline: detection, tracking, trajectory and conflict analysis."
requires-python = ">=3.10"

# Heavy runtime dependencies (opencv, ultralytics, torch) are pinned in
# cv/requirements.txt so the API service can be installed without them. Only
# numpy is required to import this package's interfaces and geometry types.
dependencies = ["numpy>=1.26", "trajyx-shared"]

[tool.setuptools.packages.find]
include = ["trajyx_cv*"]
